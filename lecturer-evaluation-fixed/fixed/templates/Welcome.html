<!DOCTYPE html>
<head>
      <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(12, 12, 14, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        nav {
            background: rgba(255,255,255,0.98);
            padding: 14px 28px;
            border-radius: 14px;
            margin-bottom: 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 12px;
        }
        nav .brand {
            font-size: 19px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            text-decoration: none;
        }
        nav .brand span {
            color: #4f46e5;
        }
        nav .links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
        }
        nav .links a {
            text-decoration: none;
            color: #475569;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s;
            position: relative;
        }
        nav .links a:hover { color: #4f46e5; }
        nav .links a.active { 
            color: #4f46e5; 
            font-weight: 700;
        }
        nav .links a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            right: 0;
            height: 2px;
            background: #4f46e5;
            border-radius: 2px;
        }
        .role-pill {
            background: #eef2ff;
            color: #4338ca;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid #c7d2fe;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .role-pill:hover {
            background: #e0e7ff;
        }
        .card {
            background: rgba(255,255,255,0.98);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 28px;
        }
        .header h1 { 
            font-size: 30px; 
            font-weight: 800; 
            margin-bottom: 6px; 
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3); 
        }
        .header p { 
            font-size: 14px; 
            opacity: 0.8; 
            font-weight: 400;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        input, textarea, select {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
            background: #fff;
            color: #0f172a;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        textarea { resize: vertical; min-height: 110px; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 18px;
        }
        .form-group { margin-top: 18px; }
        button {
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
        }
        .error {
            background: #fef2f2;
            color: #991b1b;
            padding: 14px 18px;
            border-radius: 10px;
            margin-top: 18px;
            font-size: 13px;
            font-weight: 500;
            border-left: 4px solid #ef4444;
        }
        .success {
            background: #f0fdf4;
            color: #166534;
            padding: 14px 18px;
            border-radius: 10px;
            margin-top: 18px;
            font-size: 13px;
            font-weight: 500;
            border-left: 4px solid #22c55e;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
        }
        th {
            background: #f8fafc;
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.8px;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }
        tr:hover td { background: #f8fafc; }
        .badge {
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
        }
        .badge-rating-1 { background: #fef2f2; color: #991b1b; }
        .badge-rating-2 { background: #fff7ed; color: #9a3412; }
        .badge-rating-3 { background: #fefce8; color: #a16207; }
        .badge-rating-4 { background: #f0fdf4; color: #166534; }
        .badge-rating-5 { background: #eff6ff; color: #1e40af; }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-view {
            background: #eef2ff;
            color: #4338ca;
        }
        .btn-view:hover {
            background: #e0e7ff;
        }
        .truncate {
            max-width: 320px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #64748b;
        }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            nav { flex-direction: column; gap: 12px; }
            .header h1 { font-size: 24px; }
        }
    </style>
</head>
    <body>
        <div class="card" style="max-width: 520px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 24px;">
            <h1 style="font-size: 22px; font-weight: 700; color: #0f172a;">Anonymous Feedback</h1>
            <p style="font-size: 14px; color: #64748b; margin-top: 6px;">
            Submit your lecturer evaluation securely. YOUR IDENTITY IS NEVER RECORDED
            </p>
        </div>
    </div>

<div class="card">
    <form method="POST">
        <div class="form-row">
            <div>
                <label>Lecturer Name *</label>
                <input type="text" name="lecturer_name" placeholder="e.g. Dr Okafor" required>
            </div>
            <div>
                <label>Course *</label>
                <input type="text" name="course" placeholder="e.g. Machine Learning" required>
            </div>
        </div>
        <div class="form-row">
            <div>
                <label>Course Code</label>
                <input type="text" name="course_code" placeholder="e.g. CSC101">
            </div>
            <div>
                <label>Rating *</label>
                <select name="rating" required>
                    <option value="1">1 — Poor</option>
                    <option value="2">2 — Fair</option>
                    <option value="3" selected>3 — Average</option>
                    <option value="4">4 — Good</option>
                    <option value="5">5 — Excellent</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Comment *</label>
            <textarea name="comment" placeholder="Share your honest feedback about the lecturer..." required></textarea>
        </div>
        <button type="submit">Submit </button>

    </body>
</head>
